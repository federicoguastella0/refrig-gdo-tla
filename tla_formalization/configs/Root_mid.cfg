\* Intermediate bounds + deadlock checking for Root

CONSTANTS
  Clients = {c1}
  MaxEpoch = 2
  MaxSeq = 2
  SoftRotationThreshold = 1
  MaxTx = 2
  MaxHash = 1
  MaxChunks = 2
  MaxTransfers = 1

SPECIFICATION Spec

INVARIANTS
  TypeOK
  Inv_NonceUniqueness
  Inv_NoDoubleActuation
  Inv_PersistBeforeDispatch
  Inv_NoActuationDuringRecovery
  Inv_NoDeadlockUnderRecovery
  Inv_AuthorizedResolution
  Inv_NoDoubleInstall
  Inv_NoInstallBeforeManifest
  Inv_AtMostOneTransferPerClient
  Inv_SharedRecovery

CHECK_DEADLOCK TRUE
