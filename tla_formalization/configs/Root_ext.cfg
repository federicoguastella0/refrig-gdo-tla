\* Extended bounds + deadlock checking enabled for Root composition

CONSTANTS
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxSeq = 3
  SoftRotationThreshold = 2
  MaxTx = 2
  MaxHash = 1
  MaxChunks = 2
  MaxTransfers = 2

SPECIFICATION Spec

INVARIANTS
  TypeOK
  Inv_NonceUniqueness
  Inv_NoDoubleActuation
  Inv_PersistBeforeDispatch
  Inv_NoActuationDuringRecovery
  Inv_NoDeadlockUnderRecovery
  Inv_AuthorizedResolution
  Inv_NoDoubleInstall
  Inv_NoInstallBeforeManifest
  Inv_AtMostOneTransferPerClient
  Inv_SharedRecovery

